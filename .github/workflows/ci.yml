name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Typecheck the examples
        run: npx tsc -p examples/tsconfig.json

  # The conformance suite spends real testnet USDC against the live sandbox,
  # so it is never part of CI. It is run deliberately, by a human, with a
  # funded key: see docs/conformance.md.
