name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options: ["@daski/x402-scheme", "@daski/pay"]

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish with provenance
        run: npm publish --workspace "${{ inputs.package }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Per §5: a SHA256SUMS file ships with every release so installers can
      # verify what they got against what was published.
      - name: Publish SHA256SUMS
        run: |
          set -euo pipefail
          # "@daski/pay" -> packages/pay, "@daski/x402-scheme" -> packages/x402-scheme
          dir="packages/${PACKAGE##*/}"
          test -f "$dir/package.json"
          cd "$dir"
          tarball="$(npm pack --silent)"
          sha256sum "$tarball" | tee SHA256SUMS
        env:
          PACKAGE: ${{ inputs.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: packages/*/SHA256SUMS
