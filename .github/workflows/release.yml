name: Release
run-name: ${{ inputs.release_attempt || format('Publish {0}', inputs.package) }}

on:
  workflow_dispatch:
    inputs:
      release_attempt:
        description: Durable release-coordinator attempt ID
        required: false
        type: string
      package:
        description: Package to publish
        required: true
        type: choice
        options: ["@daski/x402-scheme", "@daski/pay"]

permissions:
  contents: read
  id-token: write   # npm trusted publishing (OIDC) and provenance

concurrency:
  group: publish-${{ inputs.package }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11.x; trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      # Trusted publishing: npm exchanges this job's OIDC token for a short-lived
      # publish credential, so no registry token exists anywhere. Each package
      # lists this repository and workflow as its trusted publisher on
      # npmjs.com (Settings -> Trusted publishing -> GitHub Actions:
      # daski-io / buyer / release.yml). Provenance is generated automatically.
      - name: Publish with provenance
        run: npm publish --workspace "${{ inputs.package }}" --provenance --access public

      # Per §5: a SHA256SUMS file ships with every release so installers can
      # verify what they got against what was published.
      - name: Publish SHA256SUMS
        run: |
          set -euo pipefail
          # "@daski/pay" -> packages/pay, "@daski/x402-scheme" -> packages/x402-scheme
          dir="packages/${PACKAGE##*/}"
          test -f "$dir/package.json"
          cd "$dir"
          tarball="$(npm pack --silent)"
          sha256sum "$tarball" | tee SHA256SUMS
        env:
          PACKAGE: ${{ inputs.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: packages/*/SHA256SUMS
