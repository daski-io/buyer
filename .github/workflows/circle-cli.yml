name: Circle CLI

# The direct-review adapter runs every @circle-fin/cli release from its floor
# (docs/direct-reviews.md). Every week, and on demand for any version, this
# installs the floor and Circle's latest release outside the repository and
# runs the offline adapter tests against each: the installed CLI runs a whole
# review in the review child, against a fake of Circle's API
# (packages/pay/test/circleReviewVendor.test.ts). It is an early warning only:
# Circle's setup installs its latest release at once, so agents may run a
# build before this has seen it. It is not part of the package proof or the
# release evidence (the CI workflow).
#
# It runs code from npm that nobody here reviewed, so it gets no secrets, no
# credentials in the checkout, a read-only token, actions pinned by commit,
# and no cache that another workflow could restore.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "@circle-fin/cli version or dist-tag to test beside the floor"
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  adapter:
    name: adapter (Node ${{ matrix.node }}, @circle-fin/cli ${{ matrix.circle }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
        circle: ["1.2.0", "${{ inputs.version || 'latest' }}"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - name: Install @circle-fin/cli ${{ matrix.circle }} outside the repository
        env:
          CIRCLE: ${{ matrix.circle }}
        run: |
          cd "$RUNNER_TEMP"
          npm install --prefix circle-cli --no-save --no-audit --no-fund --ignore-scripts "@circle-fin/cli@$CIRCLE"
          node -e 'const p = require(process.argv[1]); console.log(p.name + "@" + p.version)' "$RUNNER_TEMP/circle-cli/node_modules/@circle-fin/cli/package.json"
      - name: Offline adapter tests against it
        env:
          DASKI_TEST_CIRCLE_CLI: ${{ runner.temp }}/circle-cli/node_modules/.bin
        run: npm run test:circle --workspace @daski/pay
